<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/staiul/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Registro personale di Manovellanza.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MANOVELLA">
  <meta name="application-name" content="MANOVELLA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MANOVELLA</title>
  <link rel="manifest" href="manifest.json?v=2">
  <style>
    /* Su tutti gli iPhone con notch/Dynamic Island: sfondo uniforme anche
       dietro la barra di stato, senza fascia bianca o sfumatura del browser. */
    html, body { margin: 0; min-height: 100%; background: #16110c; }
  </style>
  <script>
    // In modalità "Aggiungi a schermata Home" iOS può completare il calcolo
    // della viewport dopo che Flutter è già partito. Forziamo quindi Flutter
    // a riallineare canvas e coordinate touch quando la viewport si stabilizza.
    (() => {
      let debounce;
      const syncViewport = () => window.dispatchEvent(new Event('resize'));
      const scheduleSync = () => {
        clearTimeout(debounce);
        debounce = setTimeout(syncViewport, 50);
      };
      const syncAfterLaunch = () => [0, 150, 500, 1200].forEach(
        delay => setTimeout(syncViewport, delay)
      );
      window.addEventListener('load', syncAfterLaunch);
      window.addEventListener('pageshow', syncAfterLaunch);
      window.addEventListener('orientationchange', syncAfterLaunch);
      window.visualViewport?.addEventListener('resize', scheduleSync);
      window.visualViewport?.addEventListener('scroll', scheduleSync);
    })();
  </script>
</head>
<body>
  <!--

    or to give the user feedback during the initialization process.

    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
